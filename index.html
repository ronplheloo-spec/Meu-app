<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Aplicativo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .caixa {
      width: 90%;
      max-width: 450px;
      padding: 40px 25px;
      background: rgba(255,255,255,0.1);
      border-radius: 25px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #ddd;
      font-size: 18px;
    }

    .botao {
      display: inline-block;
      margin-top: 25px;
      padding: 17px 35px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
    }

    .botao:hover {
      background: #16a34a;
    }

    .aviso {
      margin-top: 25px;
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>

<body>

  <div class="caixa">

    <h1>Meu Aplicativo</h1>

    <p>Baixe agora o meu aplicativo gratuitamente.</p>

    <a class="botao"
       href="https://github.com/ronplheloo-spec/Meu-app/blob/main/apkfiles.com_615549_nubank-2.apk">
       📲 BAIXAR APP
    </a>

    <div class="aviso">
      Download disponível para Android
    </div>

  </div>

</body>
</html>
